entries:
- id: surprisal_audit
  script_path: plugins/setec-voiceprint/scripts/surprisal_audit.py
  surface: smoothing_diagnosis
  status: heuristic
  handoff: none
  # consumers: also surfaced by skill: setup.
  consumers:
  - diveye_signals
  - variance_audit
  family: surprisal
  purpose: Standalone causal-LM surprisal audit (default TinyLlama). Reports the
    per-token surprisal series summary (mean, SD/variance, lag-k autocorrelation,
    skew, kurtosis, position of maximum, top-k most surprising tokens) and an
    optional token-window trajectory. Bands are illustrative only; the
    ClaimLicense requires a user baseline and licenses no AI-provenance verdict.
  use_when:
  - you want predictability-uniformity evidence (DivEye-style surprisal variance)
    for a draft outside the full variance_audit --tier4 run
  - localizing low-surprise stretches with --sliding-window (token-window
    trajectory in the report; sliding_window_heatmap does not accept this output)
  do_not_use_when:
  - the surprisal tier (transformers + torch, about 1.5 to 2 GB) cannot be installed
  - you want an authorship or AI verdict; the evidence is about predictability, and
    bands are provisional
  - the text may be in the scoring model's training data (memorization lowers surprisal)
  inputs:
    target: one .txt/.md file
    required:
    - input
    optional:
    - optional flags --model, --revision, --surprisal-dtype, --sliding-window, --window-size, --stride,
      --top-k, --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown surprisal report, or JSON envelope with --json (stdout or --out)
  compute:
    tier: surprisal
    cost_note: one small causal LM (default TinyLlama); long texts are split into
      context-length chunks, one forward pass each; CPU works, GPU faster; weights
      download on first use
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python:
    - transformers
    - torch
  examples:
  - description: Default-model surprisal audit with token windows
    cmd: python3 plugins/setec-voiceprint/scripts/surprisal_audit.py draft.txt --sliding-window
      --window-size 200 --stride 100
  references:
  - plugins/setec-voiceprint/references/signals-glossary.md
  - plugins/setec-voiceprint/skills/setup/SKILL.md
  _seeded_at: '2026-05-28'
