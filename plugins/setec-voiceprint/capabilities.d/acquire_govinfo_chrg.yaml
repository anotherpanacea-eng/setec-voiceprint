entries:
- id: acquire_govinfo_chrg
  script_path: plugins/setec-voiceprint/scripts/acquire_govinfo_chrg.py
  surface: voice_coherence_acquisition
  status: structural_only
  handoff: none
  consumers: []
  family: acquisition
  purpose: stage candidate prepared witness blocks from GovInfo CHRG with detected
    boundary evidence and pending source review.
  use_when:
  - staging a private CHRG witness-statement inventory for document-level completeness,
    official-duty role, and third-party rights review
  do_not_use_when:
  - the source is not the GovInfo CHRG collection
  - a detected text boundary would be mistaken for complete-work or rights certification
  inputs:
    target: GovInfo published service (collection CHRG) via the api.data.gov API
  outputs:
    schema_version: '1.0'
    artifacts:
    - candidate impostor .txt + .meta.json under ai-prose-baselines-private/impostors/<register>/<persona>/
    - draft reference-pool manifest JSONL (corpus_role impostor; language_status unknown)
  compute:
    tier: acquisition
    cost_note: network-bound; published + granules pagination plus one HTM fetch per hearing granule
    length_floor_words: 1500
  registers:
  - testimony_policy
  dependencies:
    python:
    - bs4
    - requests
  examples: []
  references:
  - plugins/setec-voiceprint/references/acquire-corpus-pattern.md
  - plugins/setec-voiceprint/references/acquire-govinfo-chrg-boundaries.md
  _seeded_at: '2026-06-11'
