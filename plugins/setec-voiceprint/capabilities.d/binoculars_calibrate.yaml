entries:
- id: binoculars_calibrate
  script_path: plugins/setec-voiceprint/scripts/binoculars_calibrate.py
  surface: calibration
  status: structural_only
  handoff: none
  # consumers: threshold source — emits the operating point operators pass to
  # binoculars_audit. Also surfaced by skills: setec, setup.
  consumers:
  - binoculars_audit
  family: binoculars
  purpose: Operator-side Binoculars threshold calibration. Runs binoculars_audit over a labeled
    manifest, derives empirical threshold-low and threshold-high values by ROC analysis at a
    target FPR and TPR, and writes a calibration report. The framework default thresholds stay
    unset; the output is the operator's own calibration. Logs progress to stderr and, with
    --scores-cache, checkpoints every scored entry so a killed run continues with --resume.
  use_when:
  - you run binoculars_audit and want thresholds calibrated on your own labeled corpus instead
    of none
  - re-checking calibration after changing the scorer or observer model
  - resuming a calibration run that was killed or hung (--scores-cache plus --resume)
  do_not_use_when:
  - you have no labeled manifest with ai_status positives and negatives
  - the surprisal tier (transformers + torch, about 1.5 to 2 GB) cannot be installed
  - you want thresholds to become framework defaults; they remain operator-side
  inputs:
    target: a JSONL manifest with ai_status labels
    required:
    - manifest
    optional:
    - optional flags --scorer, --observer, --scorer-revision, --observer-revision, --surprisal-dtype,
      --positive-statuses, --negative-statuses, --score-version, --fpr-target, --target-tpr,
      --max-entries, --max-entries-seed, --out, --out-md, --scores-cache, --resume, --cache-flush-every,
      --progress-every (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - calibration report JSON (--out)
    - Markdown calibration report (--out-md)
    - per-entry scores checkpoint (--scores-cache)
  compute:
    tier: surprisal
    cost_note: two causal LMs (scorer and observer) per manifest entry; GPU recommended for
      large manifests; --max-entries subsamples; pass --scores-cache on long runs so a crash
      loses at most the unflushed entries
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python:
    - transformers
    - torch
  examples:
  - description: Calibrate Binoculars thresholds on a labeled manifest
    cmd: python3 plugins/setec-voiceprint/scripts/binoculars_calibrate.py manifest.jsonl --fpr-target
      0.01 --out calib.json --out-md calib.md
  - description: Checkpoint a long run; rerunning the same command after a crash continues it
    cmd: python3 plugins/setec-voiceprint/scripts/binoculars_calibrate.py manifest.jsonl --scores-cache
      calib.scores.json --resume --out calib.json --out-md calib.md
  references:
  - plugins/setec-voiceprint/skills/setup/SKILL.md
  _seeded_at: '2026-05-28'
