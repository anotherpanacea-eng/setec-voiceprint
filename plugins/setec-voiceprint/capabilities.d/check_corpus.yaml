entries:
- id: check_corpus
  script_path: plugins/setec-voiceprint/scripts/check_corpus.py
  surface: validation
  status: heuristic
  handoff: none
  # consumers: also surfaced by skill: validation.
  consumers:
  - restoration_packet
  - task_surfaces
  - validation_harness
  family: corpus-hygiene
  purpose: Content-level corpus hygiene gate. Runs the preprocessing strip rules
    over files, directories, or a filtered manifest slice and reports, per file,
    the share of tokens stripped as suspected non-prose contamination (HTML, CSS,
    code, tables, markup) that would distort POS/KL and other distributional
    diagnostics; files are clean, warn (>= 1% stripped) or fail (>= 5%) at
    operator-adjustable thresholds, and undecodable bytes are counted.
  use_when:
  - before a KL-sensitive diagnostic, baseline build, or validation_harness run,
    to refuse contaminated inputs
  - checking newly acquired impostor or baseline text for scraped markup or code
  - auditing a manifest slice (--manifest with --filter use=baseline,register=...)
  do_not_use_when:
  - you need schema or provenance checks (use manifest_validator)
  - the manifest exceeds about 1M files (use shard_runner --task corpus_hygiene;
    the script warns at that size)
  - you want a prose-quality, authorship or AI/human judgment; the ratio only
    measures strippable non-prose content
  inputs:
    target: files (--path), directories of .txt/.md (--dir), or a JSONL manifest
      (--manifest, optionally --filter)
    required:
    - at least one of --path, --dir, --manifest
    optional:
    - optional flags --filter, --warn-threshold, --fail-threshold, --strip-rules, --strip-aggressive,
      --show-stripped, --json, --out, --records-cache (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown hygiene report (stdout or --out)
    - JSON report with per-file strip ratios and statuses (--json)
  compute:
    tier: core
    cost_note: stdlib only; one read and strip pass per file; wall-clock grows with
      file count (seconds at 10K files, about 30 min at 436K)
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Hygiene-check the baseline slice of a manifest
    cmd: python3 plugins/setec-voiceprint/scripts/check_corpus.py --manifest corpus_manifest.jsonl
      --filter use=baseline,register=blog_essay
  references:
  - plugins/setec-voiceprint/skills/validation/SKILL.md
  _seeded_at: '2026-05-28'
