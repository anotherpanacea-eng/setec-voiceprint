entries:
- id: manuscript_repetition_audit
  script_path: plugins/setec-voiceprint/scripts/manuscript_repetition_audit.py
  surface: smoothing_diagnosis
  status: heuristic
  handoff: none
  # consumers: no code importer; surfaced by skill: smoothing-diagnosis.
  consumers: []
  family: repetition
  purpose: Manuscript-wide vocabulary repetition. Runs repetition_audit's per-chapter
    scoring against the writer's external baseline across every chapter, then
    aggregates into dispersed habit vocabulary (flagged in many chapters),
    concentrated repetition (one or two chapters at high ratio), and a per-chapter
    top-N list.
  use_when:
  - looking for habit vocabulary that recurs at moderate ratio across many chapters,
    which a single-chapter audit misses
  - separating dispersed habits from one-off thematic spikes before a vocabulary
    restoration pass
  do_not_use_when:
  - you have no writer-specific baseline corpus (--baseline-dir is required)
  - you want words distinctive to one chapter against the rest of the manuscript
    (use chapter_distinctiveness_audit)
  - you want a calibrated AI/human verdict; ratios are revision cues
  inputs:
    target: a manuscript file split by --chapter-pattern, or a --chapter-dir of chapter
      files
    required:
    - manuscript or --chapter-dir
    - --baseline-dir
    optional:
    - --chapter-pattern, --anchors, --top-dispersed, --top-concentrated, --top-per-chapter,
      --min-dispersed-chapters, --min-count, --min-word-len, --cluster-window, --min-ratio,
      --include-function-words, --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown dashboard (dispersed, concentrated, per-chapter) (stdout or --out)
    - JSON envelope (--json)
  compute:
    tier: core
    cost_note: stdlib only (tokenization and counting); no spaCy, no API costs
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Habit vocabulary across a manuscript against a personal baseline
    cmd: python3 plugins/setec-voiceprint/scripts/manuscript_repetition_audit.py manuscript.md
      --baseline-dir baseline/
  references:
  - plugins/setec-voiceprint/skills/smoothing-diagnosis/SKILL.md
  - plugins/setec-voiceprint/capabilities.d/repetition_audit.yaml
  _seeded_at: '2026-05-28'
