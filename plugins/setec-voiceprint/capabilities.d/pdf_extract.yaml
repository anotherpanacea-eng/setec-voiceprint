entries:
- id: pdf_extract
  script_path: plugins/setec-voiceprint/scripts/pdf_extract.py
  surface: voice_coherence_acquisition
  status: structural_only
  handoff: none
  # consumers: also surfaced by skills: corpus-acquisition, setup.
  consumers:
  - acquisition_core
  - pdf_inventory
  family: acquisition
  purpose: extract plain text from a user-filtered pdf_inventory JSONL into the
    private impostor pool (pypdf text layer, or ocrmypdf for image-only and mixed
    PDFs unless --skip-ocr), writing .txt + .meta.json per PDF and draft manifest
    entries with corpus_role impostor.
  use_when:
  - you ran pdf_inventory, kept the rows that should join the pool, and annotated
    them with persona, register, register_match, topic_match, consent_status, era
    and impostor_for
  - building an academic or report-register impostor pool from a local PDF library
  do_not_use_when:
  - the inventory rows lack the impostor fields the manifest validator requires
  - the PDFs are remote URLs (use acquire_pdf_urls)
  - image-only PDFs matter and the OCR layer (ocrmypdf plus tesseract,
    ghostscript, qpdf) is not installed; those rows are skipped
  inputs:
    target: filtered pdf_inventory JSONL (--inventory)
    required:
    - --inventory
    - --output-dir
    optional:
    - optional flags --emit-manifest, --workers, --ocr-language, --ocr-dpi, --skip-ocr, --dry-run,
      --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - impostor .txt + .meta.json under <output-dir>/<persona-slug>/ (the row's
      persona, falling back to an author-derived slug; private path required unless
      --allow-public-output)
    - draft manifest JSONL (corpus_role impostor)
    - optional JSON run summary (--out)
  compute:
    tier: ocr
    cost_note: local; pypdf text-layer extraction is fast; OCR via ocrmypdf is slow
      and needs system binaries
    length_floor_words: null
  registers:
  - all_nonfiction
  dependencies:
    python:
    - pypdf
    python_optional:
    - ocrmypdf
  examples:
  - description: Text-layer-only first pass over a filtered inventory
    cmd: python3 plugins/setec-voiceprint/scripts/pdf_extract.py --inventory filtered_inventory.jsonl
      --output-dir ai-prose-baselines-private/impostors/academic_philosophy/ --skip-ocr
  references:
  - plugins/setec-voiceprint/references/acquire-corpus-pattern.md
  - plugins/setec-voiceprint/skills/corpus-acquisition/SKILL.md
  _seeded_at: '2026-05-28'
