entries:
- id: baseline_discovery
  script_path: plugins/setec-voiceprint/scripts/baseline_discovery.py
  surface: setup
  status: structural_only
  handoff: none
  # consumers: no code importer; surfaced by skill: setup.
  consumers: []
  family: setup
  purpose: Locate the user's existing ai-prose-baselines-private/ folder before a
    fresh SETEC instance creates an empty duplicate. Searches common locations
    (repo sibling, ~/Documents, Obsidian / Dropbox / Google Drive / OneDrive /
    iCloud roots, home), summarizes each candidate (manifest entries, impostor
    personas, last modified), recommends one, and prints the SETEC_BASELINES_DIR
    export line. Read-only.
  use_when:
  - first-run setup, or a new machine or git worktree, before any script writes
    baselines
  - SETEC appears to be writing into an empty baselines folder instead of your
    synced one
  - checking whether a specific path is a usable baselines folder (--validate)
  do_not_use_when:
  - SETEC_BASELINES_DIR is already set and points at the folder you use
  - you want the folder created or the environment changed; the script only
    reports and recommends
  inputs:
    target: none (scans common filesystem locations); --validate PATH checks one path
    optional:
    - optional flags --json, --validate, --max-depth (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - human-readable candidate report with the recommended export line (stdout)
    - JSON candidate list (--json)
  compute:
    tier: core
    cost_note: stdlib only; bounded directory walk (default depth 4) under each
      search root; writes nothing
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Survey common locations for an existing baselines folder
    cmd: python3 plugins/setec-voiceprint/scripts/baseline_discovery.py
  - description: Check whether one path is a usable baselines folder
    cmd: python3 plugins/setec-voiceprint/scripts/baseline_discovery.py --validate ~/ai-prose-baselines-private
  references:
  - plugins/setec-voiceprint/skills/setup/SKILL.md
  _seeded_at: '2026-05-28'
