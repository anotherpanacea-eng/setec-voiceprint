entries:
- id: voice_drift_tracker
  script_path: plugins/setec-voiceprint/scripts/voice_drift_tracker.py
  surface: voice_coherence
  status: heuristic
  handoff: none
  consumers:
  - generate_voice_report
  - pov_voice_profile
  family: voice-drift
  purpose: Time-drift surface. Groups date-tagged baseline documents into periods (year, quarter,
    month or custom), then reports per-period voiceprint summaries, a cross-period voice-distance
    matrix (Burrows Delta and cosine per feature family), drifting features and stable features
    (the durable idiolect).
  use_when:
  - deciding whether a draft's distance from the baseline is recent stylistic evolution or sudden
    distortion
  - seeing which features of your voice changed over the years and which stayed stable
  do_not_use_when:
  - the baseline has no dates (manifest date_written or date-prefixed filenames)
  - periods hold fewer than --min-docs-per-period documents (default 2); they are dropped
  - you want an authorship verdict
  inputs:
    target: a dated corpus via --manifest, --baseline-dir (date-prefixed filenames) or --periods-json
    required:
    - one of --manifest, --baseline-dir, --periods-json
    optional:
    - optional flags --date-pattern, --use, --period-granularity, --period-boundaries, --min-docs-per-period,
      --top-drifting, --top-stable, --out, --json-out, --feature-cache, --allow-public-output
      (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown drift report (--out)
    - JSON drift report (--json-out); file outputs must sit under ai-prose-baselines-private/
      unless --allow-public-output
  compute:
    tier: core
    cost_note: stdlib feature extraction per document; an optional feature cache speeds reruns
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Year-by-year drift over a dated manifest
    cmd: python3 plugins/setec-voiceprint/scripts/voice_drift_tracker.py --manifest corpus_manifest.jsonl
      --period-granularity year --out ai-prose-baselines-private/drift.md --json-out ai-prose-baselines-private/drift.json
  references:
  - plugins/setec-voiceprint/skills/voice-coherence/SKILL.md
  _seeded_at: '2026-05-28'
