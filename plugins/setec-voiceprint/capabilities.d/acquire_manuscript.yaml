entries:
- id: acquire_manuscript
  script_path: plugins/setec-voiceprint/scripts/acquire_manuscript.py
  surface: voice_coherence_acquisition
  status: structural_only
  handoff: none
  consumers: []
  family: acquisition
  purpose: ingest local .docx / .md / .markdown / .txt manuscripts as
    identity-baseline entries (the writer's own voice, the corpus a draft is
    compared against) or, with --corpus-role impostor, as impostor entries;
    segments by chapter heading, fixed word window, or whole work.
  use_when:
  - building your own identity baseline from manuscripts on disk before running
    voice_profile, voice_distance or general_imposters
  - adding a local manuscript collection to the impostor pool (--corpus-role
    impostor with --impostor-for)
  do_not_use_when:
  - the source is EPUB (use acquire_epub) or PDF (use pdf_inventory then
    pdf_extract)
  - the files mix several authors under one --persona; each run writes one
    persona
  inputs:
    target: a .docx/.md/.txt file, or a directory of them
    required:
    - source
    - --persona
    - --register
    optional:
    - --corpus-role, --use, --ai-status, --consent-status, --era, --impostor-for,
      --segment, --window-words, --min-words, --dry-run, --output-dir,
      --emit-manifest, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - .txt + .meta.json under ai-prose-baselines-private/identity/<register>/<persona>/
      (or impostors/... with --corpus-role impostor)
    - draft_manifest.jsonl
    - optional JSON run summary (--out)
  compute:
    tier: core
    cost_note: local, offline, stdlib only (DOCX read as zipped XML); no network
    length_floor_words: 300
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Build a personal identity baseline from a novel manuscript
    cmd: python3 plugins/setec-voiceprint/scripts/acquire_manuscript.py my_novel.md
      --persona my_pen_name_fiction --register literary_horror --consent-status author_consent
      --ai-status pre_ai_human --segment chapter --min-words 300
  references:
  - plugins/setec-voiceprint/references/acquire-corpus-pattern.md
  _seeded_at: '2026-06-02'
