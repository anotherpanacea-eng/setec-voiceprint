entries:
- id: manuscript_bigram_diff
  script_path: plugins/setec-voiceprint/scripts/manuscript_bigram_diff.py
  surface: smoothing_diagnosis
  status: heuristic
  handoff: none
  # consumers: restoration_packet's --bigram-json accepts this surface's JSON. Also
  # surfaced by skills: metric-targeted-restoration, smoothing-diagnosis.
  consumers:
  - restoration_packet
  family: pos-bigram-diff
  purpose: Per-bigram POS-bigram diff between two corpora at the aggregate level
    (per-file mean, pooled, or both). Surfaces the syntactic templates that most
    separate corpus A from corpus B, for register-level questions such as how an
    AI-collaborated cohort differs from a pre-AI archive.
  use_when:
  - comparing the syntactic-template footprint of two of your own corpora (e.g.
    post-2022 vs pre-AI)
  - feeding a corpus-level bigram diff into restoration_packet
  do_not_use_when:
  - you have one target document (use bigram_diff)
  - the corpora differ in register or genre; the diff will mostly measure that
  - you want an AI/human verdict on either corpus
  inputs:
    target: two corpora as directories (--corpus-a-dir/--corpus-b-dir) or file lists
      (--corpus-a-files/--corpus-b-files)
    required:
    - corpus A (--corpus-a-dir or --corpus-a-files)
    - corpus B (--corpus-b-dir or --corpus-b-files)
    optional:
    - --label-a, --label-b, --aggregation, --top, --min-count, --smoothing-alpha,
      --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown table of top divergent POS bigrams with examples (stdout or --out)
    - JSON envelope (--json) consumed by restoration_packet --bigram-json
  compute:
    tier: spacy
    cost_note: one spaCy tagging pass per file in both corpora; cost scales with
      total corpus size
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python:
    - spacy
  examples:
  - description: Post-AI vs pre-AI corpus syntactic-template diff
    cmd: python3 plugins/setec-voiceprint/scripts/manuscript_bigram_diff.py --corpus-a-dir
      post_ai/ --label-a post-ai --corpus-b-dir pre_ai/ --label-b pre-ai --top 20 --min-count
      10
  references:
  - plugins/setec-voiceprint/skills/smoothing-diagnosis/SKILL.md
  - plugins/setec-voiceprint/skills/metric-targeted-restoration/SKILL.md
  _seeded_at: '2026-05-28'
