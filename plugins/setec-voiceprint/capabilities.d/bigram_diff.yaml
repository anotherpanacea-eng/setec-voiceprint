entries:
- id: bigram_diff
  script_path: plugins/setec-voiceprint/scripts/bigram_diff.py
  surface: smoothing_diagnosis
  status: heuristic
  handoff: none
  # consumers: also surfaced by skills: metric-targeted-restoration,
  # smoothing-diagnosis.
  consumers:
  - manuscript_bigram_diff
  - restoration_packet
  family: pos-bigram-diff
  purpose: Per-bigram POS-bigram diff of one target document against a cluster of
    comparator documents. Ranks the spaCy POS bigrams by their contribution to the
    divergence (cluster mean, pooled, or both), with example token pairs, so a
    variance_audit POS-bigram KL elevation can be traced to the specific syntactic
    templates driving it.
  use_when:
  - variance_audit flagged elevated POS-bigram KL/JSD against a baseline and you want
    to know which bigrams drive it
  - preparing a metric-targeted restoration packet (restoration_packet reads this JSON)
  - comparing one draft against a small set of the writer's own comparator texts
  do_not_use_when:
  - you want word-level repetition (use repetition_audit or manuscript_repetition_audit)
  - you are comparing two whole corpora rather than one document (use manuscript_bigram_diff)
  - you want an AI/human verdict; a bigram contribution is a revision cue, not evidence
    of provenance
  inputs:
    target: one .txt/.md target plus comparator files (--cluster-dir or --cluster-files)
    required:
    - target
    - --cluster-dir or --cluster-files
    optional:
    - --cluster-mode, --top, --min-count, --smoothing-alpha, --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown table of top divergent POS bigrams with examples (stdout or --out)
    - JSON envelope (--json) consumed by restoration_packet --bigram-json
  compute:
    tier: spacy
    cost_note: one spaCy tagging pass per target and comparator file; no model
      download beyond en_core_web_sm
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python:
    - spacy
  examples:
  - description: Top divergent POS bigrams of a draft against comparators
    cmd: python3 plugins/setec-voiceprint/scripts/bigram_diff.py target.md --cluster-dir
      comparators/ --top 20 --min-count 5
  references:
  - plugins/setec-voiceprint/skills/smoothing-diagnosis/SKILL.md
  - plugins/setec-voiceprint/skills/metric-targeted-restoration/SKILL.md
  _seeded_at: '2026-05-28'
