entries:
- id: function_word_grammar_audit
  script_path: plugins/setec-voiceprint/scripts/function_word_grammar_audit.py
  surface: voice_coherence
  status: heuristic
  handoff: none
  consumers:
  - function_word_adjacency_audit
  family: function-word-grammar
  purpose: 'Function-word sequence grammar. Adds the sequence layer to Burrows-Delta frequencies:
    function-word bigrams and trigrams, preposition profile, demonstrative usage, relative-pronoun,
    complementizer and subordinator choice, auxiliary chains and pronoun transitions, with optional
    baseline comparison.'
  use_when:
  - voice_distance shows function-word drift and you want to know which grammatical choices
    moved (which/that, whether/if)
  - comparing a draft's function-word grammar against the writer's own baseline (--baseline-dir)
  do_not_use_when:
  - the target is very short; proportions over a few hundred function words are noisy
  - you want an authorship verdict; the profile is descriptive
  inputs:
    target: one .txt/.md file
    required:
    - input
    optional:
    - optional flags --baseline-dir, --json, --out, --strip-rules, --strip-aggressive, --strip-masking,
      --allow-non-prose, --include-baseline-filenames (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown function-word grammar report (stdout or --out)
    - JSON envelope (--json)
  compute:
    tier: core
    cost_note: stdlib only (tokenization and counting); no spaCy, no API costs
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Function-word grammar against a personal baseline
    cmd: python3 plugins/setec-voiceprint/scripts/function_word_grammar_audit.py draft.md --baseline-dir
      baseline/ --json
  references:
  - plugins/setec-voiceprint/capabilities.d/voice_distance.yaml
  _seeded_at: '2026-05-28'
