entries:
- id: chapter_distinctiveness_audit
  script_path: plugins/setec-voiceprint/scripts/chapter_distinctiveness_audit.py
  surface: smoothing_diagnosis
  status: heuristic
  handoff: none
  # consumers: no code importer; surfaced by skill: smoothing-diagnosis.
  consumers: []
  family: repetition
  purpose: Chapter-aware vocabulary distinctiveness. For each chapter, scores words
    over-represented against the rest of the manuscript (leave-one-out internal
    baseline) plus within-chapter clustering, surfacing thematic anchors, setting
    props and chapter-local habits. No external corpus required.
  use_when:
  - you want words distinctive to one chapter against the rest of the same manuscript
  - you have no external baseline corpus but want chapter-level repetition cues
  - pairing with manuscript_repetition_audit to separate chapter-local words from
    manuscript-wide habit vocabulary
  do_not_use_when:
  - you want habit vocabulary that recurs across many chapters (the leave-one-out
    baseline absorbs it; use manuscript_repetition_audit)
  - the manuscript has one chapter or the chapter markers do not match
    --chapter-pattern
  - you want a calibrated AI/human verdict; ratios are revision cues
  inputs:
    target: a manuscript file split by --chapter-pattern (default '^#+\s*Chapter\s+\d+'),
      or a --chapter-dir of chapter files
    required:
    - manuscript or --chapter-dir
    optional:
    - optional flags --chapter-pattern, --anchors, --top-per-chapter, --min-count, --min-word-len,
      --cluster-window, --min-ratio, --include-function-words, --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown per-chapter distinctiveness report (stdout or --out)
    - JSON envelope (--json)
  compute:
    tier: core
    cost_note: stdlib only (tokenization and counting); no spaCy, no API costs
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Chapter-distinctive words with project anchors excluded
    cmd: python3 plugins/setec-voiceprint/scripts/chapter_distinctiveness_audit.py novel.md
      --anchors anchors.txt --top-per-chapter 10 --json
  references:
  - plugins/setec-voiceprint/skills/smoothing-diagnosis/SKILL.md
  - plugins/setec-voiceprint/capabilities.d/repetition_audit.yaml
  _seeded_at: '2026-05-28'
