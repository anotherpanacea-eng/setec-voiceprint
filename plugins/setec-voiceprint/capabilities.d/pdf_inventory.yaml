entries:
- id: pdf_inventory
  script_path: plugins/setec-voiceprint/scripts/pdf_inventory.py
  surface: voice_coherence_acquisition
  status: structural_only
  handoff: none
  # consumers: also surfaced by skills: corpus-acquisition, setup.
  consumers:
  - pdf_extract
  family: acquisition
  purpose: walk a local PDF library and emit a private JSONL inventory that
    classifies each PDF as text_extractable / image_only / mixed / corrupted from
    a first-five-pages text sample, with metadata quality and an estimated word
    count; the review surface the user filters and annotates before pdf_extract.
    Writes no cleaned text and no manifest entries.
  use_when:
  - you have a library of PDFs (papers, reports, books) and want to see what is
    extractable before adding any of it to the impostor pool
  - triaging which PDFs need OCR before running pdf_extract
  do_not_use_when:
  - the PDFs are remote URLs (use acquire_pdf_urls)
  - you want extracted text; this step only describes the library
  inputs:
    target: local directory of PDFs (--root)
    required:
    - --root
    - --output
    optional:
    - optional flags --include-glob, --exclude-glob, --max-files, --workers, --max-file-bytes,
      --no-incremental-cache, --refresh-partial (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - private pdf inventory JSONL (one row per PDF, under ai-prose-baselines-private/
      unless --allow-public-output)
  compute:
    tier: ocr
    cost_note: local; opens every PDF and samples its first five pages with pypdf;
      incremental cache lets an interrupted run resume
    length_floor_words: null
  registers:
  - all_nonfiction
  dependencies:
    python:
    - pypdf
  examples:
  - description: Inventory a PDF library into a private JSONL for review
    cmd: python3 plugins/setec-voiceprint/scripts/pdf_inventory.py --root papers/ --output
      ai-prose-baselines-private/pdf_inventory.jsonl
  references:
  - plugins/setec-voiceprint/references/acquire-corpus-pattern.md
  - plugins/setec-voiceprint/skills/corpus-acquisition/SKILL.md
  _seeded_at: '2026-05-28'
