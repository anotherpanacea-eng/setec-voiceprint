entries:
- id: register_classifier
  script_path: plugins/setec-voiceprint/scripts/register_classifier.py
  surface: validation
  status: heuristic
  handoff: none
  consumers:
  - voice_distance
  family: register-diagnostics
  purpose: Classify prose into one of eight scorer-backed register families and
    compare that family with canonical manifest register declarations so
    voice-distance reports expose register mismatch instead of silently treating
    every baseline as comparable.
  use_when:
  - You need a lightweight, stdlib-only register-family compatibility check
    before interpreting voice distance.
  - You need canonical voiceprint manifest registers or deprecated classifier
    spellings resolved into the versioned register_families/v2 vocabulary.
  do_not_use_when:
  - You need a definitive document-type classification, calibrated probability,
    authorship verdict, or AI/human judgment; these scores are uncalibrated
    compatibility heuristics.
  - You need to distinguish document types collapsed within one family, such as
    legal briefs from grant proposals.
  inputs:
    target: Prose text plus an optional canonical, family, or deprecated register
      hint; register_match also accepts baseline register declarations.
  outputs:
    schema_version: '1.0'
    artifacts:
    - In-memory classify_register and register_match dictionaries carrying the
      register_families/v2 taxonomy marker; classify_register always carries a
      nullable refusal_reason (short_text, all_weak, or exact_top_tie when it
      refuses, otherwise null).
    refusal_reasons:
    - short_text
    - all_weak
    - exact_top_tie
  compute:
    tier: core
    cost_note: Pure stdlib regex and counting heuristics; no model, network, or GPU.
    length_floor_words: 100
  registers:
  - formal_legal_policy
  - formal_first_person
  - academic
  - journalism
  - narrative_fiction
  - first_person_essay
  - promotional
  - short_social
  - unknown
  dependencies:
    python: []
  examples: []
  references: []
