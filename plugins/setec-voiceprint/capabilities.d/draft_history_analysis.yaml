entries:
- id: draft_history_analysis
  script_path: plugins/setec-voiceprint/scripts/draft_history_analysis.py
  surface: validation
  status: heuristic
  handoff: none
  consumers: []
  family: draft-trajectory
  purpose: Version-aware stylometric trajectory across a chronological sequence of drafts. Runs
    variance_audit signals on each version and reports per-version metrics, adjacent-version
    deltas, the inflection point per signal, and a heuristic per-signal shape (stable_throughout,
    gradual_drift, sudden_shift, restored_after_drift).
  use_when:
  - you have several dated versions of one piece and want to see where in the revision arc signals
    moved
  - checking whether later edits restored what an earlier pass flattened
  do_not_use_when:
  - you have only one before/after pair (use before_after_restoration or known_editor_profile)
  - you want a provenance verdict for any version; the report names where signals moved, not
    why
  inputs:
    target: a JSON list of {label, path} draft versions in chronological order (--versions-json)
    required:
    - --versions-json
    optional:
    - optional flags --tier2 (adds spaCy signals), --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown trajectory report (stdout or --out)
    - JSON envelope (--json)
  compute:
    tier: core
    cost_note: one variance_audit pass per version; tier 1 is stdlib, --tier2 needs spaCy
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
    python_optional:
    - spacy
  examples:
  - description: Trajectory across four drafts
    cmd: python3 plugins/setec-voiceprint/scripts/draft_history_analysis.py --versions-json
      drafts.json --json --out trajectory.json
  references:
  - plugins/setec-voiceprint/capabilities.d/variance_audit.yaml
  _seeded_at: '2026-05-28'
