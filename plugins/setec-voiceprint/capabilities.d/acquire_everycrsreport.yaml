entries:
- id: acquire_everycrsreport
  script_path: plugins/setec-voiceprint/scripts/acquire_everycrsreport.py
  surface: voice_coherence_acquisition
  status: structural_only
  handoff: none
  consumers: []
  family: acquisition
  purpose: pull Congressional Research Service reports from EveryCRSReport.com
    into the policy_brief impostor pool (the population baseline argmove_profile
    profiles).
  use_when:
  - building the legacy policy_brief population baseline from CRS reports
  - reviewing candidate-only historical CRS versions in bounded metadata batches
  do_not_use_when:
  - the source is not the EveryCRSReport reports.csv index
  inputs:
    target: EveryCRSReport reports.csv URL (default https://www.everycrsreport.com/reports.csv)
    language_status: unknown by default; native, non_native_advanced, non_native_intermediate, or learner requires evidence for every author in the acquisition batch (ordinary manifest output)
  outputs:
    schema_version: '1.0'
    artifacts:
    - impostor .txt + .meta.json under ai-prose-baselines-private/impostors/<register>/<persona>/
    - draft_manifest.jsonl (legacy mode only; corpus_role impostor)
    - private historical candidate receipt (historical mode only; no manifest)
  compute:
    tier: acquisition
    cost_note: legacy mode fetches one CSV plus HTML; historical mode fetches one CSV and at most --metadata-limit per-report JSON records plus selected HTML
    length_floor_words: 1500
  registers:
  - policy_brief
  dependencies:
    python:
    - bs4
    - requests
  examples: []
  references:
  - plugins/setec-voiceprint/references/acquire-corpus-pattern.md
  - plugins/setec-voiceprint/references/acquisition-author-language-status.md
  - plugins/setec-voiceprint/references/acquire-everycrsreport-historical-versions.md
  _seeded_at: '2026-06-11'
