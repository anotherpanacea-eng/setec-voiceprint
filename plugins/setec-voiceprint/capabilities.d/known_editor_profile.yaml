entries:
- id: known_editor_profile
  script_path: plugins/setec-voiceprint/scripts/known_editor_profile.py
  surface: validation
  status: heuristic
  handoff: none
  consumers: []
  family: editor-profile
  purpose: 'Learn an editorial transformation profile from labeled before/after pairs (learn
    mode: per-signal mean and SD of after-minus-before deltas), then match a new pair against
    it (match mode: per-signal z-scores and a matches_profile style verdict), so a known editor''s
    ordinary pass is not mistaken for evidence about provenance.'
  use_when:
  - you have several before/after pairs from the same editor and writer and want to know whether
    a new pass looks like that editor's normal work
  do_not_use_when:
  - you have fewer than two pairs (signal SDs are undefined)
  - you want an authorship verdict; the match only says normal editing by this editor vs a different
    process
  inputs:
    target: 'learn: a pairs JSON (--pairs-json); match: --before, --after and a learned --profile'
    required:
    - mode (learn or match)
    - learn needs --pairs-json and --out; match needs --before, --after, --profile
    optional:
    - optional flags --profile-label, --tier2, --include-filenames (learn); --z-threshold, --tier2,
      --json, --out (match) (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - profile JSON (learn)
    - match report, Markdown or JSON (--json)
  compute:
    tier: core
    cost_note: one variance_audit pass per text; tier 1 is stdlib, --tier2 needs spaCy
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
    python_optional:
    - spacy
  examples:
  - description: Learn an editor profile from labeled pairs
    cmd: python3 plugins/setec-voiceprint/scripts/known_editor_profile.py learn --pairs-json
      pairs.json --out profile.json
  references:
  - plugins/setec-voiceprint/capabilities.d/variance_audit.yaml
  _seeded_at: '2026-05-28'
