entries:
- id: acquire_blogger_takeout
  script_path: plugins/setec-voiceprint/scripts/acquire_blogger_takeout.py
  surface: voice_coherence_acquisition
  status: structural_only
  handoff: none
  # consumers: no code importer — acquire_corpus_template cites it as a prose reference
  # instance only. Surfaced by skills: corpus-acquisition, setup.
  consumers: []
  family: acquisition
  purpose: import a Google Takeout Blogger export (a Takeout directory or a
    single feed.atom) offline into the private impostor pool, one cleaned .txt +
    .meta.json per post plus a draft manifest; comment feeds are skipped unless
    --include-comments.
  use_when:
  - the author shared a Google Takeout Blogger export and you want the full
    archive without scraping the public site
  - building a register-matched impostor pool from a Blogger blog you hold an
    export of
  do_not_use_when:
  - you only have the live blog URL (use acquire_blog)
  - you want the comment threads as the author's voice; comments are other
    people's prose and a different register
  inputs:
    target: Google Takeout Blogger directory or a single Blogger feed.atom file
    required:
    - takeout_path
    - --persona
    - --author
    - --impostor-for
    - --register
    - --consent-status
    optional:
    - --since/--until, --min-words, --max-posts, --include-comments, --dry-run,
      --output-dir, --emit-manifest, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - impostor .txt + .meta.json under ai-prose-baselines-private/impostors/<register>/<persona>/
    - draft_manifest.jsonl (corpus_role impostor)
    - optional JSON run summary (--out)
  compute:
    tier: acquisition
    cost_note: local and offline; Atom parsing plus HTML-to-text per post; no network
    length_floor_words: 250
  registers:
  - blog_essay
  - all_nonfiction
  dependencies:
    python:
    - bs4
    - lxml
  examples:
  - description: Dry-run a Takeout Blogger export before writing the impostor pool
    cmd: python3 plugins/setec-voiceprint/scripts/acquire_blogger_takeout.py Takeout/
      --persona author_slug --author "Author Name" --impostor-for my_persona
      --register blog_essay --consent-status author_consent --dry-run
  references:
  - plugins/setec-voiceprint/references/acquire-corpus-pattern.md
  - plugins/setec-voiceprint/skills/corpus-acquisition/SKILL.md
  _seeded_at: '2026-05-28'
