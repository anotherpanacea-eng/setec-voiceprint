entries:
- id: stance_modality_audit
  script_path: plugins/setec-voiceprint/scripts/stance_modality_audit.py
  surface: voice_coherence
  status: heuristic
  handoff: none
  consumers:
  - argmove_profile
  family: stance-modality
  purpose: Typed stance and modality audit. Counts deontic and epistemic modals, hedges, boosters,
    evidentials, first-person stance and refusal markers per 1,000 words, with a provisional
    band over posture-shift signals (hedge-booster oscillation, booster dominance, refusal absence,
    first-person collapse) and optional per-category baseline z-scores.
  use_when:
  - checking whether editing shifted the writer's epistemic posture (more boosters, fewer hedges
    or refusals)
  - comparing a draft's stance profile against the writer's own baseline (--baseline-dir)
  do_not_use_when:
  - the register legitimately requires a posture (deontic policy prose, evidential academic
    prose); compare against a register-matched baseline
  - you want an AI/human verdict; marker lists and bands are heuristic
  inputs:
    target: one .txt/.md file
    required:
    - input
    optional:
    - optional flags --baseline-dir, --json, --out, --strip-rules, --strip-aggressive, --strip-masking,
      --allow-non-prose, --include-baseline-filenames (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown stance/modality report (stdout or --out)
    - JSON envelope (--json)
  compute:
    tier: core
    cost_note: stdlib only (lexicon matching); no spaCy, no API costs
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Stance posture against a personal baseline
    cmd: python3 plugins/setec-voiceprint/scripts/stance_modality_audit.py draft.md --baseline-dir
      baseline/ --json
  references:
  - plugins/setec-voiceprint/references/signals-glossary.md
  _seeded_at: '2026-05-28'
