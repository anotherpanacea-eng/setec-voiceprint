entries:
- id: phraseological_signature_audit
  script_path: plugins/setec-voiceprint/scripts/phraseological_signature_audit.py
  surface: voice_coherence
  status: heuristic
  handoff: none
  consumers: []
  family: phraseology
  purpose: 'Phrase-frame mining over the writer''s reusable language frames. Reports lexical
    bundles, slot frames ("not just X but Y"), curated idioms, hapax-phrase survival and stance/intensifier
    frames: per-frame counts, baseline-frame survival rate in the target, and density per 1,000
    target words. The frame-level complement to idiolect_detector''s word-level keyness.'
  use_when:
  - checking whether a revised draft kept the writer's recurring phrase frames
  - pairing with idiolect_detector for a phrase-level voice-preservation read
  do_not_use_when:
  - you have no baseline; lexical-bundle and hapax-survival categories need --baseline-dir
  - you want an authorship verdict; survival rates are descriptive
  inputs:
    target: one .txt/.md target plus a baseline directory of the writer's prose
    required:
    - target
    optional:
    - optional flags --baseline-dir (needed for lexical_bundles and hapax_phrase_survival),
      --category, --keep-quotes, --bundle-min-count, --hapax-n, --json, --out (see --help)
  outputs:
    schema_version: '1.0'
    artifacts:
    - Markdown phraseology report (stdout or --out)
    - JSON envelope (--json)
  compute:
    tier: core
    cost_note: stdlib only (n-gram counting and curated templates); no spaCy, no API costs
    length_floor_words: null
  registers:
  - all_fiction
  - all_nonfiction
  dependencies:
    python: []
  examples:
  - description: Phrase-frame survival against a personal baseline
    cmd: python3 plugins/setec-voiceprint/scripts/phraseological_signature_audit.py draft.md
      --baseline-dir baseline/ --json
  references:
  - plugins/setec-voiceprint/capabilities.d/idiolect_detector.yaml
  _seeded_at: '2026-05-28'
