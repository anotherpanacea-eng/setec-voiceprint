[pytest]
# `testpaths` keeps a bare `pytest` (from the repo root) scoped to the suite.
#
# Parallelism is OPT-IN, not a default here: run `pytest -n auto` (needs
# pytest-xdist: `pip install pytest-xdist`) — the ~4,300-test suite then runs in
# ~2 min instead of ~7. CI installs pytest-xdist and passes `-n auto` explicitly
# (see .github/workflows/tests.yml).
#
# Why not `addopts = -n auto`? It would make a bare `pytest` HARD-ERROR (exit 4,
# "unrecognized arguments: -n") in any env without pytest-xdist. A conftest that
# injects `-n auto` only when xdist is importable is unreliable on pytest 9 (the
# default is read before a local conftest can set it), so the explicit-flag form
# is the robust choice.
testpaths = plugins/setec-voiceprint/scripts/tests

# The single scripts-root pythonpath (per
# specs/svp-packaging-conversion.md §6 "Test substrate"). pytest prepends this
# to sys.path before collection, so every test file can `import <script>` or
# `from setec import paths` without its own per-file sys.path bootstrap. This
# is a real repo-relative path (plugins/setec-voiceprint/scripts), NOT the
# repo-root `scripts` symlink — the packaging codemod that removed the
# per-file bootstraps never follows that symlink either. This spec does not
# create scripts/tests/conftest.py; fleet-coordination/specs/
# setec-test-consolidation.md Part A owns that file and shared fixtures.
pythonpath = plugins/setec-voiceprint/scripts
